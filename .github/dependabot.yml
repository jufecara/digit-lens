version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    # Allow dependabot to update all dependencies
    allow:
      - dependency-type: "all"
    # Ignore some dependencies if needed
    ignore:
      # Add dependencies to ignore here if needed
      # - dependency-name: "example-package"
      #   versions: ["1.x"]
    # Labels for dependabot PRs
    labels:
      - "dependencies"
      - "dependabot"
    # Commit message prefix
    commit-message:
      prefix: "chore"
      prefix-development: "chore(dev)"
      include: "scope"
