name: Quality Metrics

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly on Sunday

jobs:
  quality-metrics:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build
      
      - name: Run acceptance tests with metrics
        run: node packages/scripts/run-acceptance.js blocking
      
      - name: Generate quality report
        run: node -e "
          import('./packages/core/tests/helpers/quality-metrics.mjs').then(async ({ generateQualityReport }) => {
            const report = await generateQualityReport();
            console.log(JSON.stringify(report, null, 2));
            process.exit(report.summary.withRegressions > 0 ? 1 : 0);
          });
        "
      
      - name: Upload quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-metrics-\${{ github.run_number }}
          path: packages/core/tests/metrics/quality-metrics.jsonl
          retention-days: 90
      
      - name: Comment PR with quality metrics
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const metricsPath = 'packages/core/tests/metrics/quality-metrics.jsonl';
              if (fs.existsSync(metricsPath)) {
                const content = fs.readFileSync(metricsPath, 'utf8');
                const lines = content.trim().split('\n');
                const latest = JSON.parse(lines[lines.length - 1]);
                
                const comment = \`## Quality Metrics Report
                
                **Accuracy**: \${latest.accuracy.accuracyRate}
                **F1 Score**: \${latest.accuracy.f1Score}
                **Duration**: \${latest.performance.durationMs}ms
                **Status**: \${latest.status}
                **Board Detected**: \${latest.boardDetected ? '✓' : '✗'}
                **Board Usable**: \${latest.boardUsable ? '✓' : '✗'}
                \`;
                
                github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              }
            } catch (error) {
              console.log('Could not generate quality metrics comment:', error.message);
            }
