name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm-publish # <-- must match the GitHub environment name
    permissions:
      id-token: write # <-- required for OIDC trusted publishing
      contents: write # semantic-release needs this to push tags/releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Verify lockfile consistency
        run: |
          if [ -n "$(git diff package-lock.json)" ]; then
            echo "❌ package-lock.json is out of sync with package.json"
            echo "Run 'npm install' to update the lockfile"
            exit 1
          fi

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NODE_AUTH_TOKEN no longer needed with trusted publishing
